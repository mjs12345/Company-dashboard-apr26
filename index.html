<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVDA Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0c0f;
    color: #d0d0d8;
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 15% 0%, rgba(118,185,0,0.07) 0%, transparent 55%);
    pointer-events: none;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 0 20px; position: relative; }

header {
padding: 28px 0 20px;
border-bottom: 1px solid rgba(255,255,255,0.07);
margin-bottom: 24px;
display: flex; align-items: center; justify-content: space-between;
flex-wrap: wrap; gap: 12px;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.ticker-pill {
background: #76b900; color: #000;
font-family: ‘IBM Plex Mono’, monospace;
font-weight: 500; font-size: 14px; letter-spacing: 1px; padding: 6px 14px;
}
h1 { font-size: 20px; font-weight: 700; color: #f0f0f0; }
.live-badge {
display: flex; align-items: center; gap: 6px;
font-family: ‘IBM Plex Mono’, monospace; font-size: 11px; color: #76b900;
}
.live-dot {
width: 7px; height: 7px; border-radius: 50%; background: #76b900;
animation: pulse 2s infinite;
}
.section-label {
font-family: ‘IBM Plex Mono’, monospace;
font-size: 9px; color: #404050; letter-spacing: 3px;
padding: 18px 24px 10px;
}
.card {
background: #111116;
border: 1px solid rgba(255,255,255,0.06);
margin-bottom: 14px;
overflow: hidden;
width: 100%;
animation: up 0.4s ease both;
}
.tradingview-widget-container { width: 100%; }
.tradingview-widget-container__widget { width: 100%; }

.notice {
margin-top: 4px; padding: 12px 16px;
border: 1px solid rgba(255,255,255,0.05);
background: rgba(255,255,255,0.02);
font-size: 11px; color: #404050;
font-family: ‘IBM Plex Mono’, monospace; line-height: 1.7;
}
@keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>

</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <div class="ticker-pill">NVDA</div>
      <h1>NVIDIA Corporation</h1>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      ALL DATA LIVE
    </div>
  </header>

  <!-- 1. Price -->

  <div class="card">
    <div class="section-label">CURRENT PRICE & KEY STATS</div>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
      {
        "symbol": "NASDAQ:NVDA",
        "width": "100%",
        "colorTheme": "dark",
        "isTransparent": true,
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- 2. Chart -->

  <div class="card">
    <div class="section-label">PRICE CHART</div>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "symbol": "NASDAQ:NVDA",
        "width": "100%",
        "height": "450",
        "interval": "D",
        "range": "YTD",
        "timezone": "America/New_York",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "backgroundColor": "rgba(11, 11, 14, 0)",
        "gridColor": "rgba(255, 255, 255, 0.03)",
        "hide_top_toolbar": false,
        "hide_legend": false,
        "save_image": false,
        "hide_volume": false,
        "support_host": "https://www.tradingview.com"
      }
      </script>
    </div>
  </div>

  <!-- 3. Technical Analysis (full width, daily interval so dates are correct) -->

  <div class="card">
    <div class="section-label">TECHNICAL ANALYSIS & RATINGS</div>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
      {
        "symbol": "NASDAQ:NVDA",
        "width": "100%",
        "height": "450",
        "interval": "1D",
        "colorTheme": "dark",
        "isTransparent": true,
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- 4. Fundamentals -->

  <div class="card">
    <div class="section-label">FINANCIALS & FUNDAMENTALS</div>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-fundamental-data.js" async>
      {
        "symbol": "NASDAQ:NVDA",
        "width": "100%",
        "height": "450",
        "colorTheme": "dark",
        "isTransparent": true,
        "displayMode": "regular",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- 5. News -->

  <div class="card">
    <div class="section-label">LATEST NEWS</div>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
      {
        "feedMode": "symbol",
        "symbol": "NASDAQ:NVDA",
        "isTransparent": true,
        "displayMode": "regular",
        "width": "100%",
        "height": "500",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <div class="notice">
    ◈ &nbsp;All data powered by TradingView — updates automatically every time you open this page.
  </div>

</div>
</body>
</html>
